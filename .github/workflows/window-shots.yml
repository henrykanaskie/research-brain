name: window-shots

# research brain's own Windows window (app/winwindow.py), driven with the mouse and keyboard on a real Windows
# desktop: screenshots and a report (tests/winwindow_drive.py), uploaded as the "window-shots" artifact.
# Download them with:  gh run download <run id> -n window-shots

on:
  workflow_dispatch:
  push:
    branches: ["windows-polish"]

jobs:
  shots:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pillow
      - name: Drive the window
        env:
          RB_FAKE_CLAUDE: "1"
          RB_EMBEDDER: tfidf
        run: python tests/winwindow_drive.py shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-shots
          path: shots/
