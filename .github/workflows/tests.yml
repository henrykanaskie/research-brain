name: tests

on:
  push:
    branches: ["**"]   # tags run through release.yml, which calls this workflow first
  pull_request:
  workflow_call:
  workflow_dispatch:   # "Run workflow" in the Actions tab: everything, on every platform

# Minutes: GitHub counts Windows minutes double and macOS minutes ten times on a private repository. A push
# runs the full suite on Linux and on Windows (where most people use it); macOS, the oldest Python and the
# Windows installer run for releases (a v* tag, through release.yml) and when started by hand.

jobs:
  # Everything, browser tests included, on Linux.
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Run tests (API, offline, scripts, export, end-to-end browser)
        env:
          RB_FAKE_CLAUDE: "1"
          RB_EMBEDDER: tfidf
        run: python -m pytest -q tests -rs

  # Everything, browser tests and the extension included, on Windows, on every push: most people who use
  # research brain are on Windows, and its failures there (a code page that can't spell a character in a PDF,
  # file:// paths, the folder chooser) don't show up on Linux. PYTHONUTF8=0 keeps Python on the cp1252 code
  # page, as on a labmate's PC.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Install Chromium for Playwright
        run: python -m playwright install chromium
      - name: Run tests (API, offline, scripts, export, end-to-end browser, extension)
        env:
          RB_FAKE_CLAUDE: "1"
          RB_EMBEDDER: tfidf
          PYTHONUTF8: "0"
        run: python -m pytest -q tests -rfEs -p no:cacheprovider

  # The app's own code on macOS, and on the oldest Python it supports: releases and manual runs.
  platforms:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.12" }  # also the install-as-a-command steps below
          - { os: macos-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.10" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests (everything except the browser tests)
        env:
          RB_FAKE_CLAUDE: "1"
          RB_EMBEDDER: tfidf
          PYTHONUTF8: "0"
        run: python -m pytest -q tests --ignore=tests/e2e -rfEs -p no:cacheprovider
      - name: Install as a command and start it
        shell: bash
        run: |
          pip install .
          research-brain --version
          research-brain where
          research-brain install-app
          research-brain install-app --remove

  # The installer a labmate runs, on a clean Windows machine, from a folder with a space in its path, the way
  # it comes out of the release zip: install, check the version, run it again while research brain is running
  # (it must close it and update), and check what happens when it's started from inside the zip.
  windows-installer:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the release folder
        shell: bash
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
          V=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('app/__init__.py').read()).group(1))")
          W=$(basename dist/*.whl)
          mkdir -p "/c/rb test/research-brain-$V"
          cp dist/*.whl install.ps1 constraints.txt Install-research-brain.cmd "/c/rb test/research-brain-$V/"
          printf '{"version": "%s", "wheel": "%s"}' "$V" "$W" > "/c/rb test/research-brain-$V/latest.json"
          echo "RBDIR=C:\\rb test\\research-brain-$V" >> "$GITHUB_ENV"
          echo "RBV=$V" >> "$GITHUB_ENV"
      - name: Install with Windows PowerShell 5.1, as the .cmd does
        shell: powershell
        run: |
          $env:RB_NO_UV = ""
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:RBDIR\install.ps1"
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed: $LASTEXITCODE" }
          $env:Path = [Environment]::GetEnvironmentVariable("Path", "User") + ";" + $env:Path
          $v = research-brain --version
          if ($v -notmatch [regex]::Escape($env:RBV)) { throw "installed $v, expected $env:RBV" }
      - name: Update while research brain is running
        shell: powershell
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable("Path", "User") + ";" + $env:Path
          $env:RB_VAULT = "$env:RUNNER_TEMP\vault"
          $p = Start-Process research-brain -ArgumentList "serve" -PassThru -WindowStyle Hidden
          for ($i = 0; $i -lt 60; $i++) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/api/status -TimeoutSec 2 | Out-Null; break } catch { Start-Sleep 1 }
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:RBDIR\install.ps1"
          if ($LASTEXITCODE -ne 0) { throw "updating while it ran failed: $LASTEXITCODE" }
          $v = research-brain --version
          if ($v -notmatch [regex]::Escape($env:RBV)) { throw "after the update: $v" }
      - name: Started from inside the zip, it says to extract first
        shell: cmd
        run: |
          mkdir "C:\zipview"
          copy "%RBDIR%\Install-research-brain.cmd" "C:\zipview\"
          echo.| call "C:\zipview\Install-research-brain.cmd" > "C:\zipview\out.txt"
          type "C:\zipview\out.txt"
          findstr /C:"Extract All" "C:\zipview\out.txt"

  # The app as a labmate has it: built, installed by install.ps1 and opened from its Start menu entry (pythonw, no
  # console), with folders and PDFs whose names the Windows code page can't spell. tests/windows_installed.py drives
  # it: PDFs of every kind, a followed folder, the map and the viewer in Edge, closing and opening again.
  windows-installed:
    strategy:
      fail-fast: false
      matrix:
        # "odd": installed under a user folder the code page can't spell, as for a user called Łukasz
        include:
          - { os: windows-latest, home: plain }   # Windows Server, Intel/AMD
          - { os: windows-latest, home: odd }
          - { os: windows-11-arm, home: plain }   # Windows 11 itself (GitHub has it on Arm only)
          - { os: windows-11-arm, home: odd }
    name: windows-installed (${{ matrix.os }}, ${{ matrix.home }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the release folder
        shell: bash
        run: |
          python -m pip install --upgrade build playwright reportlab
          python -m playwright install ffmpeg   # for the video of the run
          python -m build --wheel
          V=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('app/__init__.py').read()).group(1))")
          W=$(basename dist/*.whl)
          mkdir -p "/c/rb test/research-brain-$V"
          cp dist/*.whl install.ps1 constraints.txt Install-research-brain.cmd "/c/rb test/research-brain-$V/"
          printf '{"version": "%s", "wheel": "%s"}' "$V" "$W" > "/c/rb test/research-brain-$V/latest.json"
          echo "RBDIR=C:\\rb test\\research-brain-$V" >> "$GITHUB_ENV"
      - name: A user folder with characters outside the code page
        if: matrix.home == 'odd'
        shell: bash
        run: |
          mkdir -p "/c/Users/Łukasz 研究/AppData/Roaming/Microsoft/Windows/Start Menu/Programs" "/c/Users/Łukasz 研究/AppData/Local"
          { echo "UV_TOOL_DIR=C:\\Users\\Łukasz 研究\\AppData\\Roaming\\uv\\tools"
            echo "UV_TOOL_BIN_DIR=C:\\Users\\Łukasz 研究\\.local\\bin"
            echo "APPDATA=C:\\Users\\Łukasz 研究\\AppData\\Roaming"; } >> "$GITHUB_ENV"
      - name: Long paths off, as on a new Windows 11 PC (GitHub's machines have them on)
        shell: powershell
        run: Set-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem -Name LongPathsEnabled -Value 0
      - name: Install uv (what most people have it installed with)
        run: python -m pip install uv
      - name: Install with Windows PowerShell 5.1, as the .cmd does
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:RBDIR\install.ps1"
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed: $LASTEXITCODE" }
      - name: Drive the installed app
        shell: powershell
        working-directory: C:\
        env:
          RB_SHOT_DIR: C:\rb-shots
        run: python "$env:GITHUB_WORKSPACE\tests\windows_installed.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installed-${{ matrix.os }}-${{ matrix.home }}
          path: C:\rb-shots

  # Updating, and speed with a large library, on the installed app: for releases, by hand, and on windows-* branches.
  # Made-up releases (tests/fake_releases.py) are offered to it: one that updates, one that can't be installed, one that
  # installs but doesn't start; updates are killed half way and files kept in use. It must open every time.
  windows-update:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/windows')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, home: plain }
          - { os: windows-latest, home: odd }
          - { os: windows-11-arm, home: plain }
    name: windows-update (${{ matrix.os }}, ${{ matrix.home }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install playwright reportlab pillow build pyyaml
      - name: Made-up releases
        shell: bash
        run: python tests/fake_releases.py "C:/rb releases"
      - name: A user folder with characters outside the code page
        if: matrix.home == 'odd'
        shell: bash
        run: |
          mkdir -p "/c/Users/Łukasz 研究/AppData/Roaming/Microsoft/Windows/Start Menu/Programs" "/c/Users/Łukasz 研究/AppData/Local"
          { echo "UV_TOOL_DIR=C:\\Users\\Łukasz 研究\\AppData\\Roaming\\uv\\tools"
            echo "UV_TOOL_BIN_DIR=C:\\Users\\Łukasz 研究\\.local\\bin"
            echo "APPDATA=C:\\Users\\Łukasz 研究\\AppData\\Roaming"; } >> "$GITHUB_ENV"
      - name: Long paths off, as on a new Windows 11 PC (GitHub's machines have them on)
        shell: powershell
        run: Set-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem -Name LongPathsEnabled -Value 0
      - name: Install this version (its installer gets uv itself)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "C:\rb releases\own\install.ps1"
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed" }
      - name: Updating
        shell: powershell
        working-directory: C:\
        env: { RB_SHOT_DIR: 'C:\rb-shots' }
        run: python "$env:GITHUB_WORKSPACE\tests\windows_update.py" local "C:\rb releases"
      - name: Speed
        if: success() || failure()
        shell: powershell
        working-directory: C:\
        env: { RB_SHOT_DIR: 'C:\rb-shots' }
        run: python "$env:GITHUB_WORKSPACE\tests\windows_speed.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-update-${{ matrix.os }}-${{ matrix.home }}
          path: C:\rb-shots

  # The same on a Mac: the Update button pressed in the installed app's own window (tests/mac_update.py).
  mac-update:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/mac')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    name: mac-update (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyobjc-framework-Quartz reportlab build
      - name: Made-up releases (in a folder with a space)
        run: python tests/fake_releases.py "$HOME/rb releases"
      - name: Install this version (its installer gets uv itself)
        run: |
          cp install.sh "$HOME/rb releases/own/"
          bash "$HOME/rb releases/own/install.sh"
      - name: Updating
        working-directory: /
        env: { RB_SHOT_DIR: /tmp/rb-shots }
        run: python "$GITHUB_WORKSPACE/tests/mac_update.py" local "$HOME/rb releases"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-update-${{ matrix.os }}
          path: /tmp/rb-shots
