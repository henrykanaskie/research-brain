[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "research-brain"
dynamic = ["version"]
description = "A local research library: papers, PDFs and notes on your own computer, as a knowledge graph."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary (lab internal)" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "requests>=2.31",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "pypdf>=4.0",
  "pypdfium2>=4.30",
  "watchdog>=4.0",
  "mcp>=2.3,<3",
  "citeproc-py>=0.12",
  "defusedxml>=0.7",
  "pint>=0.24",
]

[project.optional-dependencies]
# Better similarity links and passage search (a few hundred MB); without it research_brain uses TF-IDF.
embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "reportlab>=4.0", "playwright>=1.44", "pytest-timeout>=2.3", "bibtexparser==1.4.3"]

[project.scripts]
research-brain = "research_brain.cli:main"

[tool.hatch.version]
path = "app/__init__.py"

# The source folder is app/ (tests and run.sh import it as `app`); installed, it is the `research_brain`
# package, with the web UI, the browser extension and the scripts inside it (app/paths.py: app_root()).
[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.sources]
"app" = "research_brain"

[tool.hatch.build.targets.wheel.force-include]
"static" = "research_brain/static"
"extension" = "research_brain/extension"
"scripts" = "research_brain/scripts"

[tool.hatch.build.targets.sdist]
include = ["app", "static", "extension", "scripts", "docs", "README.md", "API.md", "SECURITY.md",
           "requirements.txt", "constraints.txt", "run.sh", "install.sh", "pyproject.toml"]
exclude = ["**/__pycache__"]
